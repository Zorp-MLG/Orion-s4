; Orion S4 - STM32F401RET6, 25 MHz HSE, USB-C (native USB FS on PA11/PA12)
[env:orion_s4]
platform = ststm32
board = genericSTM32F401RE
framework = arduino

; Upload: hold BOOT, tap RST, release BOOT -> board enumerates as USB DFU
upload_protocol = dfu
; For an ST-Link on the SWD header instead:
; upload_protocol = stlink
; debug_tool = stlink

monitor_speed = 115200

build_flags =
    -DHSE_VALUE=25000000U
    -DHAL_PCD_MODULE_ENABLED
    -DUSBCON
    -DUSBD_USE_CDC
    -DPIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -DUSBD_VID=0x0483
    -DUSBD_PID=0x5740
    -DUSB_MANUFACTURER_STRING="\"Orion\""
    -DUSB_PRODUCT_STRING="\"Orion S4\""
